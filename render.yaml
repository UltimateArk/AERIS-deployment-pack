# AERIS Render blueprint — split hosting (free tier compatible).
# Deploy: Render Dashboard > New > Blueprint > select this repo.
# Then wire URLs per RENDER_DEPLOY.md (two-pass env setup).
services:
  # 1/3 Twin physics (public WS + REST for bridge + frontend direct link)
  - type: web
    name: aeris-twin
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r Backend/requirements.render.txt
    startCommand: uvicorn Backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

  # 2/3 Aeris backend + bridge in one free web service.
  # Single-port mode auto-activates when only $PORT is set (see src/config.js):
  # frontend WS on `/`, twin ingest WS on `/ingest`.
  # Bridge runs in-process background and talks to backend via localhost.
  - type: web
    name: aeris-backend
    runtime: node
    plan: free
    rootDir: Backend/aeris
    healthCheckPath: /health
    buildCommand: >-
      npm install &&
      mkdir -p models config data/spill &&
      cp ../../ML_Models/clf_*.onnx models/ &&
      cp ../../ML_Models/rul.onnx models/ &&
      cp ../../ML_Models/calibrators.json config/ &&
      cp ../../ML_Models/feature_list.json config/ &&
      cp ../../ML_Models/scaler_anomaly.json config/ &&
      cp ../../ML_Models/threshold_anomaly.json config/ &&
      cp ../../ML_Models/trend_config.json config/ &&
      cp ../../Database/fault_catalog.json config/ &&
      ls models | head -20
    startCommand: INGEST_WS=ws://localhost:$PORT/ingest node scripts/bridge.js & npm start
    envVars:
      - key: ENGINE_REST
        value: https://aeris-twin.onrender.com
        sync: false
      - key: ENGINE_WS
        value: wss://aeris-twin.onrender.com/engine
        sync: false
      - key: NODE_VERSION
        value: "22"

  # 3/3 Frontend (static CDN)
  - type: web
    name: aeris-console
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE
        value: https://aeris-backend.onrender.com
        sync: false
      - key: VITE_WS_URL
        value: wss://aeris-backend.onrender.com/
        sync: false
      - key: VITE_TWIN_BASE
        value: https://aeris-twin.onrender.com
        sync: false
      - key: VITE_TWIN_WS
        value: wss://aeris-twin.onrender.com/engine
        sync: false
